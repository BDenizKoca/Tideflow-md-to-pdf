name: Release Build

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

jobs:
  release:
    permissions:
      contents: write
    env:
      TYPST_VERSION: 0.14.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # macOS (x64)
            args: '--target x86_64-apple-darwin'
            typst_dir: 'macos'
            typst_asset: 'typst-x86_64-apple-darwin.tar.xz'
            typst_sha256: '4e91d8e1e33ab164f949c5762e01ee3faa585c8615a2a6bd5e3677fa8506b249'
          - platform: 'macos-latest' # macOS (ARM)
            args: '--target aarch64-apple-darwin'
            typst_dir: 'macos'
            typst_asset: 'typst-aarch64-apple-darwin.tar.xz'
            typst_sha256: '470aa49a2298d20b65c119a10e4ff8808550453e0cb4d85625b89caf0cedf048'
          # Linux builds Typst from source (see "Build Typst (Linux)") instead of
          # bundling the static musl release: linuxdeploy patches an rpath into
          # every ELF in the AppImage, which corrupts static-pie binaries and
          # makes them segfault.
          - platform: 'ubuntu-22.04' # Linux
            args: ''
            typst_dir: ''
            typst_asset: ''
            typst_sha256: ''
          - platform: 'windows-latest' # Windows
            args: ''
            typst_dir: ''
            typst_asset: ''
            typst_sha256: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # For macOS cross-compilation
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            zsync

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Typst binary
        if: matrix.typst_dir != ''
        shell: bash
        run: |
          set -euo pipefail
          DEST="src-tauri/bin/typst/${{ matrix.typst_dir }}"
          TMP="$(mktemp -d)"
          ARCHIVE="$TMP/typst.tar.xz"
          mkdir -p "$DEST"
          curl -fsSL -o "$ARCHIVE" "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${{ matrix.typst_asset }}"

          EXPECTED="$(echo "${{ matrix.typst_sha256 }}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$EXPECTED" ]; then
            echo "Missing expected SHA256 for ${{ matrix.typst_asset }}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          else
            ACTUAL="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "SHA256 mismatch for ${{ matrix.typst_asset }}" >&2
            echo "Expected: $EXPECTED" >&2
            echo "Actual:   $ACTUAL" >&2
            exit 1
          fi

          tar -xJf "$ARCHIVE" -C "$TMP"
          SRC_DIR="$(find "$TMP" -maxdepth 1 -type d -name 'typst*' -print -quit)"
          if [ -z "$SRC_DIR" ]; then
            echo "Failed to locate extracted Typst directory" >&2
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$SRC_DIR"/. "$DEST"/
          chmod +x "$DEST/typst"

      - name: Cache Typst build (Linux)
        if: runner.os == 'Linux'
        id: typst-cache
        uses: actions/cache@v4
        with:
          path: ~/.typst-glibc
          key: typst-glibc-vendored-openssl-${{ env.TYPST_VERSION }}-${{ matrix.platform }}

      - name: Build Typst (Linux)
        if: runner.os == 'Linux' && steps.typst-cache.outputs.cache-hit != 'true'
        # vendor-openssl matches upstream release builds, so Typst does not depend
        # on the host OpenSSL version.
        run: cargo install typst-cli --locked --version "$TYPST_VERSION" --features vendor-openssl --root ~/.typst-glibc

      - name: Bundle Typst (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          DEST="src-tauri/bin/typst/linux"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp ~/.typst-glibc/bin/typst "$DEST/typst"
          chmod +x "$DEST/typst"
          for f in LICENSE NOTICE; do
            curl -fsSL -o "$DEST/$f" "https://raw.githubusercontent.com/typst/typst/v${TYPST_VERSION}/$f"
          done
          file "$DEST/typst"
          if ! file "$DEST/typst" | grep -q 'dynamically linked'; then
            echo "Bundled Typst must be dynamically linked (linuxdeploy corrupts static-pie binaries)" >&2
            exit 1
          fi
          ldd "$DEST/typst"
          if ldd "$DEST/typst" | grep -qE "libssl|libcrypto"; then
            echo "Bundled Typst must not link against the host OpenSSL" >&2
            exit 1
          fi
          "$DEST/typst" --version

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LDAI_UPDATE_INFORMATION: "gh-releases-zsync|BDenizKoca|Tideflow-md-to-pdf|latest|*amd64.AppImage.zsync"
          UPDATE_INFORMATION: "gh-releases-zsync|BDenizKoca|Tideflow-md-to-pdf|latest|*amd64.AppImage.zsync"
        with:
          tagName: ${{ github.ref_name }} # Use the tag name as release name
          releaseName: 'Tideflow ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Verify bundled Typst runs from the AppImage (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          APPIMAGE="$(realpath "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f | head -n 1)")"
          WORK="$(mktemp -d)"
          cd "$WORK"
          "$APPIMAGE" --appimage-extract >/dev/null
          TYPST="$(find squashfs-root/usr/lib -path '*/bin/typst/linux/typst' -type f | head -n 1)"
          printf '= Hello\n\nTideflow $x^2$\n' > smoke.typ
          "$TYPST" --version
          "$TYPST" compile smoke.typ smoke.pdf
          test -s smoke.pdf

      - name: Remove broken AppImage from the draft release (Linux only)
        if: failure() && matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The AppImage was already uploaded to the draft by tauri-action; if the
          # check above failed, pull it so the draft can't be published with it.
          TAG="${{ github.ref_name }}"
          for asset in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '\.AppImage(\.zsync)?$' || true); do
            gh release delete-asset "$TAG" "$asset" -y
          done

      - name: Upload zsync file (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZSYNC_FILE=$(find src-tauri/target/release/bundle -name "*.zsync" -type f 2>/dev/null | head -n 1)
          if [ -n "$ZSYNC_FILE" ] && [ -f "$ZSYNC_FILE" ]; then
            echo "Found zsync file: $ZSYNC_FILE, uploading to release ${{ github.ref_name }}..."
            gh release upload "${{ github.ref_name }}" "$ZSYNC_FILE" --clobber || true
          else
            echo "No zsync file found to upload."
          fi

      - name: List produced bundles (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "Listing src-tauri/target/release/bundle"
          ls -la src-tauri/target/release/bundle || true

      - name: List produced bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Listing src-tauri/target/release/bundle"
          Get-ChildItem -Path src-tauri\target\release\bundle -Force -ErrorAction SilentlyContinue | Format-List || true
